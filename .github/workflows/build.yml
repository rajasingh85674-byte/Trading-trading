name: Build Tactical Neural Matrix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-setup \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

    - name: Upgrade Pip and Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools wheel cython

    - name: Build Android APK with Buildozer
      uses: kivy/buildozer-action@v1
      with:
        filename: buildozer.spec
        android_debug: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tactical-Neural-Matrix-APK
        path: bin/*.apk
